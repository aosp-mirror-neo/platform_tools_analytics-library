// Telemetry definitions for the Android CLI (android-cli) in studio-main.
//
// Extracted from studio_stats.proto into a standalone file so that android-cli
// in studio-main (tools/analytics-library/protos/src/main/proto/) can compile
// and depend on android_cli_stats.proto without bundling the monolithic
// studio_stats.proto JAR (~12 MB).
syntax = "proto2";

package android_studio;

option java_package = "com.google.wireless.android.sdk.stats";
option java_multiple_files = true;

message AndroidCliInvocation {
  // Deprecated. Subsumed by "args" field.
  optional string command_name = 1 [deprecated = true];
  // Deprecated. Subsumed by "args" field.
  optional string sub_command_name = 2 [deprecated = true];
  // Deprecated. Subsumed by "args" field.
  repeated string global_flags = 3 [deprecated = true];
  // Deprecated. Subsumed by "args" field.
  repeated string flags = 4 [deprecated = true];

  // The name of the agent invoking android-cli
  optional Agent agent_name = 5;

  message Arg {
    optional string flag = 1;
    // Non-user-generated values only.
    optional string value = 2;
  }

  // The commands and arguments passed to android-cli. Flags names
  // (with "--"" prefix) are Arg.flag. Positional arguments, commands, and flag
  // values are Arg.value. User-generated values are redacted.
  repeated Arg args = 6;

  // Names of system environment variables of interest present during
  // android-cli invocation.
  repeated string env_var_names = 7;

  enum Agent {
    UNKNOWN = 0;
    AGY = 1;
    GEMINI_CLI = 2;
    CLAUDE_CODE = 3;
    ANDROID_STUDIO = 4;
    OTHER = 5;
    CODEX = 6;
    AI_STUDIO = 7;
  }

  // Aggregate expand/scrollTo preview render metrics for an `android preview`
  // invocation. Only populated when previews are rendered.
  message PreviewRenderStats {
    // Total number of previews rendered in this invocation.
    optional int32 total_previews = 1;
    // Number of rendered previews using `expand=vertical`.
    optional int32 expand_vertical_count = 2;
    // Number of rendered previews using `expand=horizontal`.
    optional int32 expand_horizontal_count = 3;
    // Number of rendered previews with an explicit `maxHeight` or `maxWidth`.
    optional int32 custom_max_size_count = 4;
    // Number of rendered previews using `scrollTo=end`.
    optional int32 scroll_to_end_count = 5;
    // Number of expanded previews that reached the effective
    // `maxHeight`/`maxWidth` cap (or the default 4096px cap).
    optional int32 hit_expand_size_cap_count = 6;
    // Number of rendered previews whose measured layout exceeded the 8 MP
    // MAX_IMAGE_SIZE limit and were downscaled.
    optional int32 hit_max_image_size_limit_count = 7;
    // Number of rendered previews where the project's `ui-tooling` did not
    // support the requested expand/scrollTo parameter(s) and triggered the
    // fallback warning.
    optional int32 unsupported_ui_tooling_fallback_count = 8;
  }

  // Aggregate preview render metrics, set for `android preview` render
  // invocations.
  optional PreviewRenderStats preview_render_stats = 8;
}
